<html>
    <head>
        <style>
            #navbar{display:flex;
                 flex-direction: row;
                 align-content: center;
                }
            #main{
                display:grid;
                grid-template-columns: auto auto;
            }
            #nav1
            {
                justify-self:left;
            }
            #nav2
            {
                justify-self:center;
            }
            #nav3
            {
                justify-self:right;
            }
            #loginForm
            {
                display:flex;
                flex-direction:column;
                width:20vw;
                height:20vh;
                transform:scale(1.5)
            }
            #loginInfo
            {
                font-size:2vw;
                margin: 2rem;
            }
            body
            {
                color:black;
                width:100vw;
                height:100vh;
                background-color: #f1f4f9;
            }
        </style>
    </head>
    <body>
        <div id="header">
            <nav id="navbar">
                <h1 id="nav1">Focus Tracker</h1>
            </nav>
        </div>
        <div id="main">
            <div id="loginInfo">
                <h1>Sign in</h1>
                <p>Don't have an account yet?</p>
                <button><a href="/register">Register</a></button>
            </div>
            <form id="loginForm" method="POST",action="login_form">
                {% csrf_token %}
                {{loginForm.username.label}}
                {{loginForm.username}}
                {{loginForm.password.label}}
                {{loginForm.password}}
                {{msg}}
            <button type="submit">Let me in!</button>
        </form>
        </div>
    </body>
</html>
